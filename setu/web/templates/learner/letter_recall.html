{% extends "base.html" %}
{% block content %}
<h1>{{ t("learn.recall_prompt", twin=letter.label) }}</h1>
<form method="post" action="/learn/letters/answer" class="keys">
  <input type="hidden" name="exchange_id" value="{{ exchange_id }}">
  {% for k in telugu_keys %}<button type="submit" name="key" value="{{ k }}" class="key">{{ te(k) }}</button>{% endfor %}
</form>
<form method="post" action="/learn/letters/answer" class="stack">
  <input type="hidden" name="exchange_id" value="{{ exchange_id }}">
  <label for="typed">{{ t("learn.or_type") }}</label>
  <input id="typed" name="typed" maxlength="4" autocomplete="off">
  <button type="submit">{{ t("btn.check") }}</button>
</form>
{% endblock %}

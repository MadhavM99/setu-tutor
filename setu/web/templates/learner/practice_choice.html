{% extends "base.html" %}
{% block content %}
<h1>{{ t(act.text.choice_prompt, twin=unit.label) }}</h1>
<form method="post" action="{{ act.path }}/answer" class="keys">
  <input type="hidden" name="exchange_id" value="{{ exchange_id }}">
  {% for o in options %}<button type="submit" name="choice" value="{{ o.id }}" class="key">{{ te(o.telugu) }}</button>{% endfor %}
</form>
{% endblock %}

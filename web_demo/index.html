<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="SETU: learn Telugu through Hindi, with pictures, games and an AI classmate to correct.">
<title>SETU Telugu Tutor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&display=swap">
<style>
/* layout: one phone-width column, bottom tab bar; Telugu large, Hindi first, English small under it */
:root{--bg:#f7f3ec;--surf:#fffdf9;--ink:#1f1c18;--mut:#645d54;--line:#ded6c8;--acc:#1d6b62;--soft:#e3efec;--accfg:#fff;--clay:#b4622e;--good:#1d6b62;--goodbg:#e3efec;--bad:#9b2c2c;--badbg:#f8e5e3;--warn:#8a4b0f;--warnbg:#f8ecdc;--shadow:0 1px 2px rgba(40,30,10,.08),0 6px 18px rgba(40,30,10,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181a;--surf:#1f2426;--ink:#ecebe6;--mut:#a39d92;--line:#363d40;--acc:#5cc2a6;--soft:#23403a;--accfg:#0e211c;--clay:#e0925f;--good:#7fd6bd;--goodbg:#1f3a33;--bad:#f0a0a0;--badbg:#412424;--warn:#e8b878;--warnbg:#3d2f1b;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181a;--surf:#1f2426;--ink:#ecebe6;--mut:#a39d92;--line:#363d40;--acc:#5cc2a6;--soft:#23403a;--accfg:#0e211c;--clay:#e0925f;--good:#7fd6bd;--goodbg:#1f3a33;--bad:#f0a0a0;--badbg:#412424;--warn:#e8b878;--warnbg:#3d2f1b;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);margin:0;font:17px/1.6 "Noto Sans Devanagari","Noto Sans Telugu",Inter,system-ui,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{max-width:520px;margin:0 auto;padding-block:12px 96px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 10px}
.brand{font-weight:700;font-size:1.3rem;text-decoration:none;color:var(--ink);display:flex;align-items:baseline;gap:8px}
.brand small{font:500 .78rem Inter,sans-serif;color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
button,.btn{font:inherit;cursor:pointer;border-radius:12px;border:1.5px solid var(--acc);background:var(--surf);color:var(--acc);padding:.55rem 1rem;font-weight:600;text-decoration:none;display:inline-block;text-align:center;min-height:44px}
button:hover,.btn:hover{background:var(--soft)}
button.primary,.btn.primary{background:var(--acc);color:var(--accfg)}
button.primary:hover{filter:brightness(1.07)}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--clay);outline-offset:2px}
button.ghost{border-color:var(--line);color:var(--mut);font-weight:500}
button.pill{min-height:34px;padding:.15rem .75rem;font-size:.85rem}
.en{display:block;font:500 .78em/1.35 Inter,system-ui,sans-serif;color:var(--mut)}
body.noen .en{display:none}
.card{background:var(--surf);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);padding:18px;margin:0 0 14px}
h1,h2,h3{margin:0 0 6px;line-height:1.25}
h1{font-size:1.55rem}h2{font-size:1.2rem}h3{font-size:1.02rem}
.eyebrow{font:600 .78rem Inter,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--acc)}
.te{font-family:"Noto Sans Telugu","Noto Sans Devanagari",sans-serif}
.big-te{font-size:2.7rem;line-height:1.3;font-weight:600;text-align:center;margin:6px 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.demo{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:8px 12px;font-size:.82rem;margin:0 0 12px;line-height:1.45}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surf);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav.tabs .in{display:flex;max-width:520px;width:100%;gap:4px}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--mut);padding:6px 2px;border-radius:12px;font-size:.88rem;line-height:1.25;font-weight:600;min-height:48px}
nav.tabs a .en{font-size:.68rem;font-weight:500}
nav.tabs a[aria-current="page"]{background:var(--soft);color:var(--acc)}
.map{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.node{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1.5px solid var(--line);border-radius:14px;background:var(--surf);text-decoration:none;color:var(--ink)}
.node .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 .8rem Inter,sans-serif;background:var(--soft);color:var(--acc)}
.node.done .dot{background:var(--acc);color:var(--accfg)}
.node.here{border-color:var(--acc);box-shadow:inset 3px 0 0 var(--acc)}
.node.locked{border-style:dashed}
.node .pct{font:600 .8rem Inter,sans-serif;color:var(--mut)}
.list a.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surf);text-decoration:none;color:var(--ink);margin-bottom:8px}
.badge{font:700 .74rem Inter,sans-serif;border-radius:20px;padding:2px 9px;background:var(--soft);color:var(--acc);white-space:nowrap}
.badge.todo{background:var(--line);color:var(--mut)}
.choices{display:grid;gap:10px;margin:12px 0}
.choices.two{grid-template-columns:1fr 1fr}
.opt{display:block;width:100%;text-align:left;background:var(--surf);color:var(--ink);border:1.5px solid var(--line);font-weight:500;font-size:1.15rem;padding:.7rem 1rem}
.opt.te{font-size:1.4rem}
.opt:hover{border-color:var(--acc)}
.opt.ok{background:var(--goodbg);border-color:var(--good)}
.opt.no{background:var(--badbg);border-color:var(--bad)}
.opt[disabled]{cursor:default;opacity:1}
.opt.picopt{display:grid;place-items:center;padding:6px;min-height:104px}
.fb{border-radius:14px;padding:12px 14px;margin:10px 0}
.fb.good{background:var(--goodbg);color:var(--ink)}.fb.bad{background:var(--badbg)}.fb.hint{background:var(--warnbg)}
.fb b.te{font-size:1.4rem}
.pic{width:140px;height:140px}
.choices .pic,.mpic .pic{width:80px;height:80px}
.pic .soft{fill:var(--soft);stroke:var(--acc);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.pic .line{fill:none;stroke:var(--acc);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.pic .dot{fill:var(--acc)}.pic .dotfill{fill:var(--clay)}
.picwrap{display:grid;place-items:center;margin:6px 0}
textarea{width:100%;font:1.4rem/1.5 "Noto Sans Telugu",sans-serif;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surf);color:var(--ink);resize:none;min-height:64px}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tile{font-size:1.25rem;font-family:"Noto Sans Telugu",sans-serif;min-height:42px;padding:.25rem .8rem;border-color:var(--line);color:var(--ink);font-weight:500;background:var(--surf)}
.raju{display:flex;gap:10px;align-items:flex-start}
.av{flex:none;width:42px;height:42px;border-radius:50%;background:var(--clay);color:#fff;display:grid;place-items:center;font-weight:700}
.bubble{background:var(--surf);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:10px 14px;flex:1;min-width:0}
.bubble .te{font-size:1.45rem;line-height:1.4}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m{min-height:64px;font-size:1.2rem;padding:.4rem;color:var(--ink);border-color:var(--line);background:var(--surf);font-weight:500}
.m.te{font-size:1.45rem}
.m.sel{border-color:var(--acc);background:var(--soft)}
.m.done{opacity:.35;pointer-events:none}
.m.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.m.shake{animation:none}}
.mpic{display:grid;place-items:center}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.seg button{min-height:38px;padding:.2rem .8rem;font-size:.9rem;border-color:var(--line);color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;z-index:9;max-width:90%;text-align:center}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat b{display:block;font:700 1.6rem Inter,sans-serif;color:var(--acc)}
.mn{color:var(--mut);font-size:.9rem}
.sp{height:6px}
img.ph{display:block;margin:0 auto;object-fit:contain;max-width:100%;height:auto}
.picwrap img.ph{width:200px}
.choices img.ph{width:88px}
.mpic img.ph{width:72px}
.steps{display:grid;gap:10px;margin:0 0 16px}
a.step{display:grid;grid-template-columns:26px 64px minmax(0,1fr) 18px;gap:12px;align-items:center;padding:12px;border:1.5px solid var(--line);border-radius:18px;background:var(--surf);text-decoration:none;color:var(--ink);box-shadow:var(--shadow)}
a.step.primary{border-color:var(--acc);background:var(--soft)}
a.step:hover{border-color:var(--acc)}
a.step img{width:64px;height:64px;object-fit:contain}
.sn{width:26px;height:26px;border-radius:50%;background:var(--acc);color:var(--accfg);display:grid;place-items:center;font:700 .8rem Inter,sans-serif}
.st{font-weight:600;font-size:1.05rem;line-height:1.35;min-width:0}
.sh{display:block;font-weight:400;font-size:.85rem;color:var(--mut);margin-top:2px}
.go{font-size:1.6rem;color:var(--acc)}
a.back{display:inline-block;color:var(--mut);text-decoration:none;font-size:.9rem;margin:0 0 8px;font-weight:600}

.chip{display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;background:var(--surf);font-weight:600;font-size:.9rem}
.chip small{font:500 .7rem Inter,sans-serif;color:var(--mut)}
.avs{width:30px;height:30px;border-radius:50%;background:var(--acc);color:var(--accfg);display:inline-grid;place-items:center;font:700 .9rem Inter,sans-serif;flex:none}
.avs.big{width:52px;height:52px;font-size:1.3rem}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0;text-align:center}
.kpis b{display:block;font:700 1.6rem Inter,sans-serif;color:var(--acc)}
.pm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;font-size:.85rem}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.fcard{display:flex;gap:12px;align-items:flex-start;margin:0}
.fcard img{width:44px;height:44px;object-fit:contain;flex:none}
.status{display:inline-flex;align-items:center;gap:6px;font:500 .78rem Inter,sans-serif;color:var(--mut);margin:0 0 10px;flex-wrap:wrap}
.sdot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--mut)}.sdot.on{background:#2fae7d}.sdot.off{background:#d0a040}
.callbadge{display:inline-block;font:600 .74rem Inter,sans-serif;background:var(--soft);color:var(--acc);border-radius:8px;padding:3px 8px;margin-bottom:6px}
.callbadge.live{animation:pulse 1s infinite}.callbadge.off{background:var(--warnbg);color:var(--warn)}
@keyframes pulse{50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){.callbadge.live{animation:none}}
.aiinfo .mn{display:block;margin-top:4px}
.nudge{gap:12px}.nudge .mn{display:block}
.authgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
form label{display:block;font-weight:600;font-size:.9rem;margin:10px 0}
form input{display:block;width:100%;margin-top:4px;font:1rem Inter,sans-serif;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
form button{width:100%;margin-top:6px}
.ferr{color:var(--bad);font-size:.85rem;min-height:1.2em;margin-top:6px}
.tbl2{width:100%;border-collapse:collapse;font:.85rem Inter,sans-serif}
.tbl2 td,.tbl2 th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl2 th{color:var(--mut);font-weight:600}
.tbl2 .ok{color:#2fae7d;font-weight:700}.tbl2 .no{color:var(--bad)}
@media (max-width:899px){.kpis{grid-template-columns:repeat(2,1fr)}nav.tabs a{font-size:.78rem;padding:6px 0}}
a.step.locked{opacity:.62;border-style:dashed}
a.step.locked .go{font-size:1.1rem}
.cont{border-color:var(--acc);background:var(--soft)}
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:8px}
.strip i{height:22px;border-radius:5px;background:var(--line)}.strip i.on{background:var(--acc)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.wchip{border:1px dashed var(--line);border-radius:12px;padding:6px 8px;font-size:1.05rem;color:var(--mut);display:block}
.wchip small{display:block;font:500 .7rem Inter,sans-serif}
.wchip.on{border:1.5px solid var(--acc);background:var(--soft);color:var(--ink)}
.stats{display:inline-flex;gap:8px;align-items:center}
.stat1{display:inline-flex;align-items:center;gap:4px;font:700 .95rem Inter,sans-serif;padding:3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surf)}
.stat1.goal{padding:0 10px 0 2px}.stat1.goal small{font:600 .72rem Inter,sans-serif;color:var(--mut)}
.ring{display:block;flex:none}
.goalc .row{gap:14px;flex-wrap:nowrap}
.xpbadge{display:inline-block;background:#fff3d6;color:#8a5a00;font:700 1rem Inter,sans-serif;border-radius:999px;padding:4px 14px;margin:6px 0}
.trail{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 0 24px}
.tnode{display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--ink);text-align:center;gap:6px;position:relative;width:200px}
.tcirc{position:relative;width:88px;height:88px;border-radius:50%;background:var(--acc);box-shadow:0 6px 0 rgba(0,0,0,.22);display:grid;place-items:center;transition:transform .12s}
.tnode:active .tcirc{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.tnode.done .tcirc{background:#f2b134}
.tnode.locked .tcirc{background:#d9d3c7;box-shadow:0 6px 0 #bdb6a8}
.tnode.locked img{filter:grayscale(1);opacity:.55}
.tnode.open .tcirc{background:var(--soft);border:3px solid var(--acc);box-shadow:0 6px 0 rgba(0,0,0,.12)}
.tnode.cur .tcirc{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.tnode.cur .tcirc{animation:none}}
.tcirc .tick{position:absolute;right:-4px;bottom:-4px;width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;font:700 .95rem Inter,sans-serif;color:#b9831a;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.tbub{min-height:26px;font:700 .75rem Inter,sans-serif;color:var(--acc);letter-spacing:.06em}
.tbub:not(:empty){background:var(--surf);border:1.5px solid var(--acc);border-radius:10px;padding:2px 10px}
.tcirc .gl{font-size:1.35rem;font-weight:700;color:var(--accfg);line-height:1}
.tnode.open .gl,.tnode.locked .gl{color:var(--acc)}
.tnode.locked .gl{color:#9b9484}
.tlab{font-weight:700;font-size:1rem;line-height:1.3}
.splash{min-height:70vh;display:grid;place-content:center;text-align:center}
.splash .logo{font-size:3rem;font-weight:700;color:var(--acc)}
body.landing nav.tabs,body.landing header.top,body.landing .demo{display:none}
body.landing{padding:0}
body.landing .app{margin:0;max-width:none;width:100%;padding:0}
.land{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr}
.hero{padding:48px max(24px,6vw);background:linear-gradient(160deg,var(--soft),var(--bg) 70%)}
.hero .logo{font-size:2rem;font-weight:700;color:var(--acc)}.hero .logo small{font:600 .8rem Inter,sans-serif;color:var(--mut);letter-spacing:.08em}
.hero h1{font-size:2.6rem;line-height:1.2;margin:28px 0 12px}
.hero h1 .en{font-size:.45em;font-weight:600;margin-top:10px}
.lead{font-size:1.05rem;max-width:56ch}
.how{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:22px 0}
.how div{display:flex;gap:8px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:.88rem;font-weight:600}
.how b{width:24px;height:24px;border-radius:50%;background:var(--acc);color:var(--accfg);display:grid;place-items:center;font:700 .8rem Inter,sans-serif}
.how i{color:var(--mut);font-style:normal}
.hero .feat{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.hero .fcard{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:12px}
.authwrap{display:grid;place-items:center;padding:32px max(16px,4vw)}
.authcard{width:100%;max-width:400px;padding:22px;margin:0}
.tabs2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.tabs2 button{border-color:var(--line);color:var(--mut);font-weight:600}
.tabs2 button.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.tabs2 button.on .en{color:var(--accfg)}
#authcard[data-tab=login] #signupF,#authcard[data-tab=signup] #loginF{display:none}
.linkbtn{display:block;width:100%;margin-top:14px;background:none;border:none;color:var(--mut);font-weight:600;text-decoration:underline;min-height:0}
.linkbtn:hover{background:none;color:var(--ink)}
@media (max-width:899px){.land{grid-template-columns:1fr}.hero{padding:28px 20px}.hero h1{font-size:2rem}.authwrap{padding:12px 16px 32px}.stats .stat1.goal small{display:none}.goalc .row{flex-wrap:wrap}}
/* ---- desktop web layout ---- */
@media (min-width:900px){
 body{padding-left:0;padding-right:0;font-size:18px;background:var(--bg)}
 nav.tabs{top:0;bottom:0;right:auto;left:0;width:240px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding:84px 14px 20px}
 nav.tabs::before{content:"सेतु  SETU";position:absolute;top:22px;left:22px;font-weight:700;font-size:1.5rem;color:var(--ink)}
 nav.tabs .in{flex-direction:column;max-width:none;gap:6px}
 nav.tabs a{text-align:left;padding:10px 14px;font-size:1.02rem;min-height:0;flex:none}
 nav.tabs a .en{font-size:.78rem}
 .app{max-width:1060px;margin:0 0 0 240px;padding:24px 48px 64px;width:calc(100% - 240px)}
 header.top .brand{visibility:hidden}
 h1{font-size:2rem}h2{font-size:1.4rem}
 .steps{grid-template-columns:1fr 1fr;gap:16px}
 a.step{padding:16px}
 a.step:first-child,a.step:last-child:nth-child(even){grid-column:1/-1}
 .list{display:grid;grid-template-columns:1fr 1fr;gap:12px}
 .list a.item{margin-bottom:0}
 .list>:not(a.item){grid-column:1/-1;margin:10px 0 0}
 .map{grid-template-columns:1fr 1fr;gap:12px}
 .choices{grid-template-columns:1fr 1fr;gap:14px}
 .mrow{grid-template-columns:repeat(3,1fr);gap:14px}
 .card{padding:26px}
 .big-te{font-size:3.4rem}
 .toast{bottom:28px;left:calc(50% + 120px)}
 .demo{font-size:.9rem}
}
@media (min-width:1300px){.app{margin:0 auto 0 calc(240px + (100% - 240px - 1060px)/2);}}
</style>
<div class="app">
  <header class="top"><a class="brand" href="#/home">सेतु <small>SETU</small></a>
    <span class="row"><span id="stats" class="stats"></span><span id="who"></span><button class="pill ghost" id="enBtn" aria-pressed="true" title="English on/off">English: on</button></span></header>
  <div class="demo">डेमो · सामग्री अभी जाँची नहीं गई<span class="en">Demo · content not yet checked by native speakers</span></div>
  <main id="view" tabindex="-1"></main>

 शुरू होता है। Telugu में 'क्या' नहीं लगता — आख़िरी शब्द के अंत में -आ (ా) जुड़ जाता है: వస్తావు (आओगे) → వస్తావా (आओगे?)।", "expl_en": "In Hindi a yes/no question starts with ‘क्या’. In Telugu there is no ‘क्या’: add -ā (ా) to the last word. వస్తావు (you will come) → వస్తావా (will you come?)", "items": [{"en": "Are you coming?", "hi": "क्या तुम आ रहे हो?", "acc": ["నువ్వు వస్తావా", "నువ్వు వస్తున్నావా"], "bad": "క్యా నువ్వు వస్తావు", "fix": ["^నువ్వు (వస్తావా|వస్తున్నావా)$"]}, {"en": "Is this a book?", "hi": "क्या यह किताब है?", "acc": ["ఇది పుస్తకమా"], "bad": "క్యా ఇది పుస్తకం", "fix": ["^ఇది పుస్తకమా$"]}]}, {"id": "HI-TE-002", "title_hi": "'यह किताब है' में 'है' नहीं लगता", "title_en": "No word for ‘is’ in ‘This is a book’", "expl_hi": "'यह किताब है' = ఇది పుస్తకం — बस। ఉంది का मतलब 'मौजूद है/रखा है', 'यह X है' कहने के लिए नहीं।", "expl_en": "‘This is a book’ = ఇది పుస్తకం, nothing more. ఉంది means ‘exists / is kept’; do not use it to say ‘this is X’.", "items": [{"en": "This is a book.", "hi": "यह किताब है।", "acc": ["ఇది పుస్తకం"], "bad": "ఇది పుస్తకం ఉంది", "fix": ["^ఇది పుస్తకం$"]}, {"en": "That is a pen.", "hi": "वह कलम है।", "acc": ["అది పెన్ను"], "bad": "అది పెన్ను ఉంది", "fix": ["^అది పెన్ను$"]}]}, {"id": "HI-TE-003", "title_hi": "'मेरे पास है' = 'मुझको है' (నాకు … ఉంది)", "title_en": "‘I have’ is ‘to me there is’ (నాకు … ఉంది)", "expl_hi": "Telugu में 'मेरे पास किताब है' ऐसे कहते हैं: 'मुझको (నాకు) एक किताब है (ఉంది)'। नेनु (నేను = मैं) नहीं, नाकु (నాకు = मुझको)।", "expl_en": "Telugu says ‘to me a book is’: నాకు ఒక పుస్తకం ఉంది. Use నాకు (to me), not నేను (I).", "items": [{"en": "I have a book.", "hi": "मेरे पास एक किताब है।", "acc": ["నాకు ఒక పుస్తకం ఉంది", "నా దగ్గర ఒక పుస్తకం ఉంది"], "bad": "నేను ఒక పుస్తకం ఉంది", "fix": ["^(నాకు|నా దగ్గర) ఒక పుస్తకం ఉంది$"]}, {"en": "You have a pen.", "hi": "तुम्हारे पास एक कलम है।", "acc": ["నీకు ఒక పెన్ను ఉంది", "నీ దగ్గర ఒక పెన్ను ఉంది"], "bad": "నువ్వు ఒక పెన్ను ఉంది", "fix": ["^(నీకు|నీ దగ్గర) ఒక పెన్ను ఉంది$"]}]}, {"id": "HI-TE-004", "title_hi": "'में' शब्द से चिपकता है: ఇంట్లో = घर में", "title_en": "‘in’ sticks to the word (ఇంట్లో = in the house)", "expl_hi": "'घर में' = ఇల్లు + లో → ఇంట్లో (एक ही शब्द)। -లో (में) अलग शब्द नहीं, शब्द के साथ जुड़ता है।", "expl_en": "‘In the house’ = ఇల్లు + లో → ఇంట్లో, one word. -లో (in) is not a separate word; it sticks to the noun.", "items": [{"en": "I am in the house.", "hi": "मैं घर में हूँ।", "acc": ["నేను ఇంట్లో ఉన్నాను"], "bad": "నేను ఇల్లు లో ఉన్నాను", "fix": ["^నేను ఇంట్లో ఉన్నాను$"]}, {"en": "I am in the room.", "hi": "मैं कमरे में हूँ।", "acc": ["నేను గదిలో ఉన్నాను"], "bad": "నేను గది లో ఉన్నాను", "fix": ["^నేను గదిలో ఉన్నాను$"]}]}, {"id": "HI-TE-005", "title_hi": null, "title_en": "Saying ‘not’: change the verb (రాను = I won't come)", "expl_hi": "Hindi में 'नहीं' अलग शब्द है। Telugu में verb का रूप ही बदल जाता है: వస్తాను (आऊँगा) → రాను (नहीं आऊँगा)। కాదు (नहीं है) यहाँ नहीं लगता।", "expl_en": "Hindi has a separate ‘नहीं’. Telugu changes the verb itself: వస్తాను (I will come) → రాను (I won't come). కాదు does not go here.", "items": [{"en": "I will not come.", "hi": "मैं नहीं आऊँगा।", "acc": ["నేను రాను"], "bad": "నేను వస్తాను కాదు", "fix": ["^నేను రాను$"]}, {"en": "He will not come.", "hi": "वह नहीं आएगा।", "acc": ["అతను రాడు", "వాడు రాడు"], "bad": "అతను వస్తాడు కాదు", "fix": ["^(అతను|వాడు) రాడు$"]}]}, {"id": "HI-TE-006", "title_hi": "'हम' के दो शब्द: మేము और మనం", "title_en": "Two words for ‘we’: మేము and మనం", "expl_hi": "మేము = हम (सुनने वाला शामिल नहीं)। మనం = हम (तुम भी शामिल)। 'हम तुम्हारे बिना जा रहे हैं' → మేము; 'तुम और मैं जा रहे हैं' → మనం।", "expl_en": "మేము = we (not including the listener). మనం = we (including you). ‘We are going without you’ → మేము; ‘you and I are going’ → మనం.", "items": [{"en": "We (but not you) are going.", "hi": "हम (तुम्हारे बिना) जा रहे हैं।", "acc": ["మేము వెళ్తున్నాం", "మేము వెళ్తున్నాము", "మేము వెళ్తాం"], "bad": "మనం వెళ్తున్నాం", "fix": ["^మేము (వెళ్తున్నాం|వెళ్తున్నాము|వెళ్తాం)$"]}, {"en": "We (you and I) are going.", "hi": "हम (तुम और मैं) जा रहे हैं।", "acc": ["మనం వెళ్తున్నాం", "మనం వెళ్తాం", "మనం వెళ్దాం"], "bad": "మేము వెళ్తున్నాం", "fix": ["^మనం (వెళ్తున్నాం|వెళ్తాం|వెళ్దాం)$"]}]}, {"id": "HI-TE-007", "title_hi": "'वह' के दो शब्द: అతను (आदमी) और ఆమె (औरत)", "title_en": "‘He’ and ‘she’ are different words", "expl_hi": "Hindi का 'वह' आदमी और औरत दोनों के लिए है। Telugu में आदमी के लिए అతను, औरत के लिए ఆమె।", "expl_en": "Hindi ‘वह’ covers both. Telugu uses అతను for a man and ఆమె for a woman.", "items": [{"en": "She is a teacher.", "hi": "वह शिक्षिका है।", "acc": ["ఆమె టీచరు", "ఆమె టీచర్"], "bad": "అతను టీచరు", "fix": ["^ఆమె (టీచరు|టీచర్)$"]}, {"en": "He is a doctor.", "hi": "वह डॉक्टर है।", "acc": ["అతను డాక్టరు", "అతను డాక్టర్", "వాడు డాక్టరు", "వాడు డాక్టర్"], "bad": "ఆమె డాక్టరు", "fix": ["^(అతను|వాడు) (డాక్టరు|డాక్టర్)$"]}]}, {"id": "HI-TE-008", "title_hi": null, "title_en": "Verb endings for ‘he’ and ‘she’", "expl_hi": "जैसे Hindi में 'आता/आती', वैसे Telugu में आदमी के लिए వస్తాడు और औरत के लिए వస్తుంది।", "expl_en": "Like Hindi आता/आती: Telugu uses వస్తాడు for a man and వస్తుంది for a woman.", "items": [{"en": "She comes.", "hi": "वह आती है।", "acc": ["ఆమె వస్తుంది"], "bad": "ఆమె వస్తాడు", "fix": ["^ఆమె వస్తుంది$"]}, {"en": "He comes.", "hi": "वह आता है।", "acc": ["అతను వస్తాడు", "వాడు వస్తాడు"], "bad": "అతను వస్తుంది", "fix": ["^(అతను|వాడు) వస్తాడు$"]}]}, {"id": "HI-TE-009", "title_hi": null, "title_en": "Respect: మీరు takes a plural ending", "expl_hi": "'आप' = మీరు, और verb भी आदर वाले रूप में: వస్తారా (आ रहे हैं?), తింటారు (खाते हैं) — వస్తావా/తింటావు 'तुम' के लिए है।", "expl_en": "‘You’ (respectful) = మీరు, and the verb takes the respectful ending: వస్తారా (are you coming?). వస్తావా is for ‘you’ (informal).", "items": [{"en": "Sir, are you coming?", "hi": "आप आ रहे हैं?", "acc": ["మీరు వస్తారా"], "bad": "మీరు వస్తావా", "fix": ["^మీరు వస్తారా$"]}, {"en": "Sir, you eat.", "hi": "आप खाते हैं।", "acc": ["మీరు తింటారు"], "bad": "మీరు తింటావు", "fix": ["^మీరు తింటారు$"]}]}, {"id": "HI-TE-010", "title_hi": "'जो मैंने पढ़ी वो किताब': बताने वाला हिस्सा पहले", "title_en": "‘The book I read’: the describing part comes first", "expl_hi": "Telugu में 'जो' नहीं होता। 'मेरी पढ़ी हुई किताब' जैसा कहते हैं: నేను చదివిన పుస్తకం — बताने वाला हिस्सा संज्ञा (किताब) से पहले।", "expl_en": "Telugu has no ‘जो’. The describing part comes before the noun: నేను చదివిన పుస్తకం (the book I read).", "items": [{"en": "This is the book that I read.", "hi": "यह वह किताब है जो मैंने पढ़ी।", "acc": ["ఇది నేను చదివిన పుస్తకం"], "bad": "ఇది జో పుస్తకం నేను చదివాను", "fix": ["చదివిన పుస్తకం"]}]}, {"id": "HI-TE-011", "title_hi": null, "title_en": "No ‘ने’ in Telugu", "expl_hi": "'उसने किताब पढ़ी' = అతను పుస్తకం చదివాడు। कर्ता (మైం/वह) वैसा ही रहता है: నేను, అతను — నాకు/అతనికి ('मुझको/उसको') नहीं।", "expl_en": "There is no ‘ने’. The doer stays as it is: నేను, అతను, not నాకు / అతనికి.", "items": [{"en": "He read the book.", "hi": "उसने किताब पढ़ी।", "acc": ["అతను పుస్తకం చదివాడు", "వాడు పుస్తకం చదివాడు"], "bad": "అతనికి పుస్తకం చదివాడు", "fix": ["^(అతను|వాడు) పుస్తకం చదివాడు$"]}, {"en": "I ate the rice.", "hi": "मैंने चावल खाया।", "acc": ["నేను అన్నం తిన్నాను"], "bad": "నాకు అన్నం తిన్నాను", "fix": ["^నేను అన్నం తిన్నాను$"]}]}, {"id": "HI-TE-012", "title_hi": "इंसान को: -ను जोड़ो (అమ్మను = माँ को)", "title_en": "Add -ను when the object is a person", "expl_hi": "'माँ को बुलाया' = అమ్మను పిలిచాను। जब काम किसी इंसान पर हो, तो उसके नाम के साथ -ను (को) जुड़ता है।", "expl_en": "When the action is on a person, add -ను to the name: అమ్మను పిలిచాను (I called mother).", "items": [{"en": "I called mother.", "hi": "मैंने माँ को बुलाया।", "acc": ["నేను అమ్మను పిలిచాను"], "bad": "నేను అమ్మ పిలిచాను", "fix": ["అమ్మను"]}, {"en": "I saw father.", "hi": "मैंने पिताजी को देखा।", "acc": ["నేను నాన్నను చూశాను"], "bad": "నేను నాన్న చూశాను", "fix": ["నాన్నను"]}]}, {"id": "HI-TE-013", "title_hi": "'आ रहा हूँ' एक शब्द: వస్తున్నాను", "title_en": "‘I am coming’ is one word: వస్తున్నాను", "expl_hi": "'खा रहा हूँ' = తింటున్నాను (एक ही शब्द)। తింటాను (खाऊँगा) + ఉన్నాను (हूँ) अलग-अलग नहीं जोड़ते।", "expl_en": "‘I am eating’ = తింటున్నాను, one word. Do not join తింటాను and ఉన్నాను separately.", "items": [{"en": "I am eating.", "hi": "मैं खा रहा हूँ।", "acc": ["నేను తింటున్నాను", "నేను తింటూ ఉన్నాను"], "bad": "నేను తింటాను ఉన్నాను", "fix": ["^నేను (తింటున్నాను|తింటూ ఉన్నాను)$"]}, {"en": "I am going.", "hi": "मैं जा रहा हूँ।", "acc": ["నేను వెళ్తున్నాను", "నేను వెళ్తూ ఉన్నాను"], "bad": "నేను వెళ్తాను ఉన్నాను", "fix": ["^నేను (వెళ్తున్నాను|వెళ్తూ ఉన్నాను)$"]}]}, {"id": "HI-TE-014", "title_hi": "'के लिए' = కోసం, शब्द के बाद", "title_en": "‘For’: కోసం comes after the word", "expl_hi": "'तुम्हारे लिए' = నీ కోసం। जैसे Hindi में 'लिए' बाद में आता है, Telugu में भी కోసం बाद में आता है।", "expl_en": "‘For you’ = నీ కోసం. Like Hindi ‘के लिए’, కోసం comes after the word.", "items": [{"en": "This is for you.", "hi": "यह तुम्हारे लिए है।", "acc": ["ఇది నీ కోసం"], "bad": "ఇది కోసం నీ", "fix": ["^ఇది నీ కోసం$"]}, {"en": "This is for me.", "hi": "यह मेरे लिए है।", "acc": ["ఇది నా కోసం"], "bad": "ఇది కోసం నా", "fix": ["^ఇది నా కోసం$"]}]}, {"id": "HI-TE-015", "title_hi": "कहीं जाना हो तो -కి (ఇంటికి), -లో नहीं", "title_en": "Going somewhere: use -కి, not -లో", "expl_hi": "'घर जा रहा हूँ' = ఇంటికి వెళ్తున్నాను। जगह की तरफ़ जाने के लिए -కి (को/की तरफ़); -లో का मतलब 'के अंदर'।", "expl_en": "To go to a place use -కి (towards): ఇంటికి వెళ్తున్నాను. -లో means ‘inside’.", "items": [{"en": "I am going home.", "hi": "मैं घर जा रहा हूँ।", "acc": ["నేను ఇంటికి వెళ్తున్నాను"], "bad": "నేను ఇంట్లో వెళ్తున్నాను", "fix": ["ఇంటికి"]}, {"en": "I go to school.", "hi": "मैं स्कूल जाता हूँ।", "acc": ["నేను బడికి వెళ్తాను"], "bad": "నేను బడిలో వెళ్తాను", "fix": ["బడికి"]}]}], "scenes": [{"id": "hi-te-scene-01", "title_hi": "ऑटो स्टैंड", "title_en": "Auto stand", "obj_hi": "ऑटो वाले से जगह, किराया और रुकने की बात कर पाना।", "obj_en": "Talk to an auto driver about the <script>
(function(){
var D=JSON.parse(document.getElementById('d').textContent);
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function B(hi,en){return '<span class="hi">'+esc(hi)+'</span>'+(en?'<span class="en" lang="en">'+esc(en)+'</span>':'')}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function uniq(a){return a.filter(function(x,i){return a.indexOf(x)===i})}
var isTe=function(s){return /[ఀ-౿]/.test(s)};
function norm(s){return String(s).normalize('NFC').replace(/[?.!,।"'’‘“”]/g,'').replace(/\s+/g,' ').trim()}
// state
function def(){return{en:true,units:{},mastery:{},rules:{},scenes:{},phrases:{},matchBest:null}}
var S=def();
try{S=Object.assign(def(),JSON.parse(localStorage.getItem('setu-v1')||'{}'))}catch(e){}
function today(){return new Date().toISOString().slice(0,10)}
var syncT=null;
function save(){S.days=S.days||[];var d=today();if(S.days[S.days.length-1]!==d){S.days.push(d);S.days=S.days.slice(-400)}S.updated=Date.now();
 try{localStorage.setItem('setu-v1',JSON.stringify(S))}catch(e){}
 if(ME){clearTimeout(syncT);syncT=setTimeout(pushProgress,1200);SYNC='saving'}}
// ---- backend client ----
var API='/api',TOKEN=null,ME=null,HEALTH=null,SYNC='',CALLS=null;
try{TOKEN=localStorage.getItem('setu-token')}catch(e){}
function api(path,opt){opt=opt||{};var h={'content-type':'application/json'};if(TOKEN)h.authorization='Bearer '+TOKEN;
 return fetch(API+path,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined}).then(function(r){return r.json().catch(function(){return{}}).then(function(j){if(!r.ok){var e=new Error(j.error||('HTTP '+r.status));e.status=r.status;throw e}return j})})}
function pushProgress(){if(!ME)return;api('/progress',{method:'PUT',body:{state:S}}).then(function(){SYNC='saved';paintChip()}).catch(function(){SYNC='offline';paintChip()})}
function streak(){var d=S.days||[],n=0,t=Date.now();for(var i=0;i<400;i++){var k=new Date(t-i*864e5).toISOString().slice(0,10);if(d.indexOf(k)>=0)n++;else if(i>0)break}return n}
var DAILY_GOAL=30;

 var pool=uniq(s.lines.reduce(function(a,x){return a.concat(norm(x.replies[0]).split(' '))},[]));var own=norm(l.replies[0]).split(' ');C.tiles=shuffle(uniq(own.concat(pick(pool,Math.max(0,5-own.length),own))));

 '<div class="raju"><div class="av" style="background:var(--acc)">'+(i+1)+'</div><div class="bubble"><div class="te" lang="te">'+esc(l.te)+'</div><div class="sp"></div>'+listenBtn(l.te)+'</div></div><div class="card" style="margin-top:12px"><p style="margin:0 0 4px"><b>'+esc(l.q_hi)+'</b></p><div class="choices" id="ch">'+l.opts_hi.map(function(o,j){return '<button class="opt" data-act="sans" data-i="'+j+'">'+esc(o)+'<span class="en" lang="en">'+esc(l.opts_en[j])+'</span></button>'}).join('')+'</div><div id="fb"></div></div><div id="reply"></div>'};

   <g id="text_1">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f1f27" x="63.837" y="59.298311" transform="rotate(-0 63.837 59.298311)">1 Plan the turn</text>
   </g>
   <g id="text_2">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #5b5b66" transform="translate(27.415125 71.245657)">planner.plan_session</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #5b5b66" transform="translate(23.329969 80.414017)">rule the learner knows,</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #5b5b66" transform="translate(21.393484 88.843001)">Raju does not; pick item</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f1f27" x="184.923" y="59.298311" transform="rotate(-0 184.923 59.298311)">2 Build the task</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #5b5b66" transform="translate(151.564172 71.245657)">classmate._prompt</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #5b5b66" transform="translate(141.380812 80.093001)">Hindi meaning, rule title,</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #5b5b66" transform="translate(134.248469 89.164017)">allowed words, last sentence</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f1f27" x="304.056" y="59.298311" transform="rotate(-0 304.056 59.298311)">3 Model drafts</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #5b5b66" transform="translate(270.673109 71.308548)">one JSON sentence</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #5b5b66" transform="translate(259.0285 80.093001)">(up to 3 drafts in the app,</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #5b5b66" transform="translate(265.72225 88.745657)">method 'tool_history')</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f1f27" x="429.048" y="59.298311" transform="rotate(-0 429.048 59.298311)">4 Leak filter</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #5b5b66" transform="translate(377.531828 71.343001)">exactly the planned mistake?</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #5b5b66" transform="translate(379.625266 80.414017)">no answer, no unseen word,</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #5b5b66" transform="translate(379.425656 89.164017)">one sentence, student voice</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1f1f27" transform="translate(540.124453 61.595263)">5a Show model</text>
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1f1f27" transform="translate(553.584328 70.956787)">sentence</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1f1f27" transform="translate(532.685203 112.74283)">5b Show approved</text>
    <text style="font-weight: 700; font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #1f1f27" transform="translate(541.433391 122.104962)">bank sentence</text>
   </g>
   <g id="text_11">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #5b5b66" x="360.693" y="79.140651" transform="rotate(-0 360.693 79.140651)">draft</text>
   </g>
   <g id="text_12">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #5b5b66" x="505.215" y="60.255284" transform="rotate(-0 505.215 60.255284)">pass</text>
   </g>
   <g id="text_13">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #5b5b66" x="505.215" y="127.337684" transform="rotate(-0 505.215 127.337684)">3 fails</text>
   </g>
   <g id="text_14">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #5b5b66" x="366.552" y="160.977245" transform="rotate(-0 366.552 160.977245)">fail: own draft + reason codes sent back</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f1f27" x="384.129" y="204.493098" transform="rotate(-0 384.129 204.493098)">Research variant 'agentic_tools' (not in the app)</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #5b5b66" transform="translate(278.962203 216.820367)">the model chooses when to call check_classmate_sentence,</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #5b5b66" transform="translate(286.102203 225.988727)">then submits; the filter still re-checks the final sentence</text>
   </g>
   <g id="text_17">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #1f1f27" x="126.333" y="204.493098" transform="rotate(-0 126.333 204.493098)">Either way</text>
   </g>
   <g id="text_18">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #5b5b66" transform="translate(21.176594 216.917711)">the learner only ever sees a sentence that passed the filter,</text>
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; fill: #5b5b66" transform="translate(31.461125 225.667711)">and nothing a model writes can grade or update state</text>
   </g>
   <g id="text_19">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #5b5b66" transform="translate(517.749969 167.369287)">measured on 29 cases (task 14):</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #5b5b66" transform="translate(497.991719 176.290569)">old loop, no memory: 76% model, 24% bank</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #5b5b66" transform="translate(522.482344 185.470569)">agentic: 97% model, 3% bank</text>
   </g>
   <g id="text_20">
    <text style="font-weight: 700; font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f1f27" x="15.012" y="24.905032" transform="rotate(-0 15.012 24.905032)">Raju's sentence: the model writes, the filter decides</text>
   </g>
  </g>
 </g>

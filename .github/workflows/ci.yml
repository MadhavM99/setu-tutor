name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: setu
          POSTGRES_USER: setu_migrate
          POSTGRES_PASSWORD: setu-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U setu_migrate -d setu"
          --health-interval 5s --health-retries 10
    env:
      SETU_TEST_ADMIN_URL: postgresql+psycopg://setu_migrate:setu-ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Hindi-only lint (catalog and learner/teacher templates)
        run: python -m scripts.lint_hindi
      - name: Tests (no model keys, no network models)
        env:
          GEMINI_API_KEY: ""
          SETU_GEMINI_API_KEY: ""
          SETU_LLM_URL: ""
        run: pytest -q

  legacy:
    # The pre-redesign app stays runnable until each feature is migrated (implementation plan §4).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Legacy tests (model keys unset)
        env:
          GEMINI_API_KEY: ""
          SETU_GEMINI_API_KEY: ""
          SETU_LLM_URL: ""
        run: python -m pytest -q -p no:cacheprovider
